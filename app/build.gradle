plugins {
    id 'com.android.application'
    id 'org.greenrobot.greendao'
}
greendao {
    schemaVersion 1 //当前数据库版本
    daoPackage 'com.example.myapplication.entity'  //生成的Dao DaoMaster和DaoSession的包名称（源实体类的包名类）
    targetGenDir 'src/main/java'  //生成源应存储的位置。默认为构建目录（build\generated\source\greenDao）


}
android {
    compileSdk 31

    defaultConfig {
        applicationId "com.example.myapplication"
        minSdk 21
        targetSdk 31
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

    implementation 'com.alibaba:fastjson:1.2.61'
    implementation 'com.github.bumptech.glide:glide:4.8.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.8.0'
    implementation "org.java-websocket:Java-WebSocket:1.4.0"
    implementation 'org.greenrobot:greendao:3.3.0'
    implementation 'q.rorbin:badgeview:1.1.3'//小红点效果
    //网络请求的架包
    implementation 'com.squareup.okhttp3:okhttp:3.8.1'
//    // 引入基础SDK
//    implementation 'com.huawei.hms:ml-computer-vision-ocr:3.2.0.300'
//    // 引入中英文文字识别模型包
//    implementation 'com.huawei.hms:ml-computer-vision-ocr-cn-model:3.2.0.300'
//    // 人脸检测服务引入基础SDK
//    implementation 'com.huawei.hms:ml-computer-vision-face:3.2.0.300'
//    //集成人脸比对服务SDK
//    implementation 'com.huawei.hms:ml-computer-vision-faceverify:3.2.0.300'
//    implementation 'com.huawei.hms:ml-computer-vision-faceverify-model:3.2.0.300'
    implementation 'com.alibaba:fastjson:1.1.72.android'
}